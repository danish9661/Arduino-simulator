name: Autofix CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run emulator tests
        working-directory: openhw-studio-emulator
        run: |
          node --version
          npm ci || true
          node --test src/circuit-validation/*.test.js
          node src/circuit-validation/smoke-test.js
