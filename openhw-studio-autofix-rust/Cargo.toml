[package]
name = "openhw-studio-autofix-rust"
version = "0.1.0"
edition = "2021"
description = "High-performance Intelligent Autofix engine for OpenHW Studio"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.4"
pathfinding = "4.3"
once_cell = "1.17"

[profile.release]
# Optimize for small binary size and speed
opt-level = "s"
lto = true
