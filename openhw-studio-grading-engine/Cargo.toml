[package]
name = "openhw-studio-grading-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
once_cell = "1.18"
postcard = { version = "1.0", features = ["alloc"] }
console_error_panic_hook = "0.1.7"

[profile.release]
opt-level = "s"
lto = true
