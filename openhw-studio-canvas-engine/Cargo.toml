[package]
name = "openhw-studio-canvas-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
tiny-skia = "0.11"
resvg = "0.38"
png = "0.17"
usvg = "0.38"
base64 = "0.21"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3", features = ["console"] }

[profile.release]
opt-level = "s"
lto = true
