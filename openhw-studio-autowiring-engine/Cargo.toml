[package]
name = "openhw-studio-autowiring-engine"
version = "0.1.0"
authors = ["danish9661 <110881758+danish9661@users.noreply.github.com>"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.84"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.4"
serde_json = "1.0"
pathfinding = "4.3"
once_cell = "1.17"
console_error_panic_hook = "0.1.7"
js-sys = "0.3.61"

[profile.release]
# Optimize for small binary size and speed
opt-level = "s"
lto = true
