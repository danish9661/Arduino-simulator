# Docker Compose for TEST Server
services:
  mongodb-test:
    image: mongo:6.0
    container_name: openhw-mongodb-test
    ports:
      - "27018:27017" # Exposed to host if needed
    volumes:
      - mongodb_data_test:/data/db

  backend-test:
    build:
      context: ./openhw-studio-backend
      dockerfile: Dockerfile
    container_name: openhw-backend-test
    ports:
      - "6001:5000" # Maps port 6001 on host to 5000 in container
    depends_on:
      - mongodb-test
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb-test:27017/openhw-studio-test
      - JWT_SECRET=test_secret_key_123
      - FRONTEND_URL=http://localhost:6000
      - ALLOWED_ORIGINS=http://localhost:6000
    volumes:
      - ./openhw-studio-examples:/usr/src/openhw-studio-examples

  frontend-test:
    build:
      context: ./OpenHW-studio-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:6001/api
    container_name: openhw-frontend-test
    ports:
      - "6000:80" # Maps port 6000 on host to 80 in Nginx
    depends_on:
      - backend-test

volumes:
  mongodb_data_test:
