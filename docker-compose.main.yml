# Docker Compose for MAIN/MAIN Server
services:
  mongodb-main:
    image: mongo:6.0
    container_name: openhw-mongodb-main
    ports:
      - "27017:27017" # Exposed to host
    volumes:
      - mongodb_data_main:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-main:
    build:
      context: ./openhw-studio-backend
      dockerfile: Dockerfile
    container_name: openhw-backend-main
    ports:
      - "5001:5000" # Host:Container
    depends_on:
      mongodb-main:
        condition: service_healthy
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb-main:27017/openhw-studio-production
      - JWT_SECRET=4f9e1a2b3c4d5e6f7g8h9i0j1k2l3m4n5o6p
      - SESSION_SECRET=a8b3c9d2f5e1g4h7j0k6m9n2p5q8r1s4t7u0v3w6x9y2z
      - GITHUB_ADMIN_TOKEN=${GITHUB_ADMIN_TOKEN}
      - GITHUB_OWNER=danish9661
      - FRONTEND_URL=http://localhost:5000
      - ALLOWED_ORIGINS=http://localhost:5000
      - EMULATOR_PATH=/usr/src/openhw-studio-emulator
    volumes:
      - ./openhw-studio-examples:/usr/src/openhw-studio-examples
      - ./openhw-studio-emulator:/usr/src/openhw-studio-emulator
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/lib-list"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend-main:
    build:
      context: .
      dockerfile: ./OpenHW-studio-frontend/Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:5001/api
        - VITE_EMULATOR_PATH=../openhw-studio-emulator
    container_name: openhw-frontend-main
    ports:
      - "5000:80" # Host:Container
    depends_on:
      backend-main:
        condition: service_healthy

volumes:
  mongodb_data_main:
