# Docker Compose for MAIN/MAIN Server
services:
  mongodb-main:
    image: mongo:6.0
    container_name: openhw-mongodb-main
    ports:
      - "27017:27017" # Exposed to host
    volumes:
      - mongodb_data_main:/data/db

  backend-main:
    build:
      context: ./openhw-studio-backend-danish
      dockerfile: Dockerfile
    container_name: openhw-backend-main
    ports:
      - "5001:5000" # Host:Container
    depends_on:
      - mongodb-main
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb-main:27017/openhw-studio-production
      - JWT_SECRET=change_me_production_key
      - FRONTEND_URL=http://localhost:5000
      - ALLOWED_ORIGINS=http://localhost:5000
      - EMULATOR_PATH=/usr/src/openhw-studio-emulator-danish
    volumes:
      - ./openhw-studio-examples-danish:/usr/src/openhw-studio-examples-danish
      - ./openhw-studio-emulator-danish:/usr/src/openhw-studio-emulator-danish

  frontend-main:
    build:
      context: ./OpenHW-studio-frontend-danish
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:5001/api
    container_name: openhw-frontend-main
    ports:
      - "5000:80" # Host:Container
    depends_on:
      - backend-main

volumes:
  mongodb_data_main:
